document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n\n\n\n\n\n\n<style>/* Villa Nord — Webfonts\n   Right Serif (Compact Regular) → headlines & titles, mostly UPPERCASE\n   Season Mix (Regular / Italic / SemiBold) → body, captions, UI */\n\n@font-face {\n  font-family: \"Right Serif\";\n  src: url(\"b91a7ec0-925a-409e-9706-a093f21f0be3\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Season Mix\";\n  src: url(\"03c28902-8c1f-4466-8f49-543dafdcfab8\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Season Mix\";\n  src: url(\"ee00b510-a9e2-4932-a1ce-0ea9da7a20dd\") format(\"opentype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Season Mix\";\n  src: url(\"34352baf-6517-4f4d-a8f2-29a8b2f49eed\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n<style>/* Villa Nord — Color tokens\n   \"For text, only black and white should be used, this is to maintain\n    a calm and mature expression.\" — Visual Identity\n\n   Palette captures quiet luxury & warmth. Dark green is the calm,\n   intimate foundation; pale blue adds freshness; grey + white are\n   neutrals; a muted rust accent introduces warmth. */\n\n:root {\n  /* ── Brand base palette (exact brandbook values) ───────────── */\n  --vn-green:        #332C1A;   /* PRIMARY  — deep warm green/olive  */\n  --vn-blue:         #B1C0DF;   /* SECONDARY— pale blue              */\n  --vn-grey:         #E0DFDF;   /* SUPPORT  — neutral grey           */\n  --vn-white:        #FFFFFF;   /* CONTRAST                          */\n  --vn-rust:         #8F3C1F;   /* ACCENT   — muted rust / deep red  */\n\n  /* ── Tonal extensions (derived, for hover/press/surfaces) ──── */\n  --vn-green-900:    #211C10;   /* darker green — press / deep bg    */\n  --vn-green-700:    #423A24;   /* hover on green surfaces           */\n  --vn-green-tint:   #4A4230;   /* hairline borders on green         */\n  --vn-blue-600:     #95A6CB;   /* blue hover / pressed              */\n  --vn-blue-tint:    #D3DCEE;   /* soft blue wash                    */\n  --vn-grey-200:     #EFEEEC;   /* warm off-white page background    */\n  --vn-grey-300:     #E0DFDF;\n  --vn-grey-500:     #B5B3AE;   /* muted captions / dividers         */\n  --vn-rust-700:     #7A3119;   /* rust hover / pressed              */\n\n  /* Ink — text is only black or white */\n  --vn-ink:          #1C1A14;   /* near-black warm ink (on light)    */\n  --vn-paper:        #FFFFFF;\n\n  /* ── Semantic aliases ──────────────────────────────────────── */\n  --color-bg:              var(--vn-grey-200);\n  --color-bg-deep:         var(--vn-green);\n  --surface-card:          var(--vn-white);\n  --surface-sunken:        var(--vn-grey-300);\n  --surface-blue:          var(--vn-blue);\n  --surface-blue-soft:     var(--vn-blue-tint);\n\n  --text-primary:          var(--vn-ink);\n  --text-muted:            #6B675C;        /* warm grey ink for support */\n  --text-on-dark:          var(--vn-white);\n  --text-on-dark-muted:    #C9C6BC;\n  --text-accent:           var(--vn-rust);\n\n  --border-subtle:         #D8D6D0;\n  --border-strong:         var(--vn-ink);\n  --border-on-dark:        var(--vn-green-tint);\n\n  --accent:                var(--vn-rust);\n  --accent-hover:          var(--vn-rust-700);\n\n  --focus-ring:            var(--vn-rust);\n}\n<\u002Fstyle>\n<style>/* Villa Nord — Typography tokens\n   Headline: Right Serif (Compact Regular) — UPPERCASE, tight, expressive.\n   Body:     Season Mix — sentence case, warm serif/sans hybrid.\n   Fallbacks per brandbook: Times New Roman (headlines), Trebuchet MS (body). */\n\n:root {\n  --font-display: \"Right Serif\", \"Times New Roman\", Georgia, serif;\n  --font-body:    \"Season Mix\", \"Trebuchet MS\", \"Segoe UI\", sans-serif;\n\n  /* Weights */\n  --fw-regular: 400;   /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n\n  /* ── Type scale (display uses Right Serif, fluid for hero use) ── */\n  --text-hero:     clamp(3rem, 7vw, 6.5rem);   /* full-bleed statements */\n  --text-display:  clamp(2.25rem, 4.5vw, 4rem);\n  --text-h1:       2.75rem;\n  --text-h2:       2rem;\n  --text-h3:       1.5rem;\n  --text-h4:       1.25rem;\n\n  /* Body scale (Season Mix) */\n  --text-lead:     1.25rem;    /* intro / standfirst */\n  --text-body:     1rem;       /* default 16px       */\n  --text-sm:       0.875rem;\n  --text-xs:       0.75rem;\n\n  /* Eyebrow / overline — Season Mix SemiBold, uppercase, tracked */\n  --text-eyebrow:  0.75rem;\n\n  /* Line heights */\n  --lh-display:    0.98;  /* @kind other */ /* tight, stacked headlines */\n  --lh-heading:    1.08;       /* @kind other */\n  --lh-body:       1.6;        /* @kind other */\n  --lh-snug:       1.35;       /* @kind other */\n\n  /* Letter-spacing */\n  --ls-display:   -0.01em;     /* Right Serif sits tight              */\n  --ls-eyebrow:    0.22em;     /* generous tracking on overlines      */\n  --ls-nav:        0.14em;     /* nav links / buttons                 */\n  --ls-body:       0.005em;\n}\n<\u002Fstyle>\n<style>/* Villa Nord — Spacing, radii, shadows, motion\n   The brand is calm, generous, and architectural. Spacing is roomy,\n   corners are mostly square (paper/stationery feel), shadows are soft\n   and rare. Restraint over decoration. */\n\n:root {\n  /* ── Spacing scale (4px base, generous editorial rhythm) ─────── */\n  --space-1:  0.25rem;   /*  4 */\n  --space-2:  0.5rem;    /*  8 */\n  --space-3:  0.75rem;   /* 12 */\n  --space-4:  1rem;      /* 16 */\n  --space-5:  1.5rem;    /* 24 */\n  --space-6:  2rem;      /* 32 */\n  --space-7:  3rem;      /* 48 */\n  --space-8:  4rem;      /* 64 */\n  --space-9:  6rem;      /* 96 */\n  --space-10: 8rem;      /* 128 — section breathing room */\n\n  /* Layout */\n  --container:      1200px;\n  --container-wide: 1440px;\n  --gutter:         clamp(1.25rem, 4vw, 4rem);  /* @kind spacing */\n\n  /* ── Radii — the brand leans square & crafted. Small, deliberate. */\n  --radius-none: 0;\n  --radius-sm:   2px;\n  --radius-md:   4px;       /* default for cards/inputs/buttons */\n  --radius-lg:   8px;\n  --radius-pill: 999px;     /* used sparingly (tags / key chips) */\n\n  /* ── Borders — hairline, ink or subtle ─────────────────────── */\n  --border-hair: 1px;\n  --border-med:  1.5px;\n\n  /* ── Shadows — soft, low, warm. Used sparingly, never glossy. ─ */\n  --shadow-none: none;\n  --shadow-sm:   0 1px 2px rgba(28, 26, 20, 0.05);\n  --shadow-md:   0 10px 30px -12px rgba(28, 26, 20, 0.18);\n  --shadow-lg:   0 30px 70px -28px rgba(28, 26, 20, 0.30);\n\n  /* ── Motion — slow, deliberate, \"time moves slower here\" ───── */\n  --ease-soft:   cubic-bezier(0.22, 0.61, 0.36, 1);  /* @kind other */\n  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);      /* @kind other */\n  --dur-fast:    160ms;   /* @kind other */\n  --dur-med:     320ms;   /* @kind other */\n  --dur-slow:    560ms;   /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Villa Nord — base element defaults (typography binding + resets).\n   Kept separate from token files; imported last by styles.css. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--text-body);\n  line-height: var(--lh-body);\n  letter-spacing: var(--ls-body);\n  color: var(--text-primary);\n  background: var(--color-bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headlines — Right Serif, uppercase by brand rule */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-display);\n  text-transform: uppercase;\n  margin: 0 0 0.4em;\n}\nh1 { font-size: var(--text-h1); }\nh2 { font-size: var(--text-h2); }\nh3 { font-size: var(--text-h3); }\nh4 { font-size: var(--text-h4); line-height: var(--lh-snug); }\n\np { margin: 0 0 1em; }\np:last-child { margin-bottom: 0; }\n\na { color: inherit; text-decoration: none; }\n\nem, i { font-style: italic; }\nstrong, b { font-weight: var(--fw-semibold); }\n\n/* Eyebrow / overline helper */\n.vn-eyebrow {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-eyebrow);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n}\n\nimg { max-width: 100%; display: block; }\n\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n<\u002Fstyle>\n<style>/* Villa Nord — interaction states for components.\n   Base look is inline in each component; these rules add hover/active/focus\n   keyed on stable component class names. Slow, calm transitions. */\n\n/* ── Buttons ─────────────────────────────────────────────────── */\n.vn-btn { -webkit-tap-highlight-color: transparent; }\n.vn-btn:not(:disabled):hover { }\n.vn-btn--primary:not(:disabled):hover  { background: var(--vn-green-700) !important; border-color: var(--vn-green-700) !important; }\n.vn-btn--accent:not(:disabled):hover   { background: var(--vn-rust-700) !important; border-color: var(--vn-rust-700) !important; }\n.vn-btn--outline:not(:disabled):hover  { background: var(--vn-ink) !important; color: var(--vn-white) !important; }\n.vn-btn--outline-light:not(:disabled):hover { background: rgba(255,255,255,0.10) !important; border-color: #fff !important; }\n.vn-btn:not(:disabled):active { transform: translateY(1px); }\n\n/* ── Inputs ──────────────────────────────────────────────────── */\n.vn-input:hover { border-color: var(--vn-grey-500) !important; }\n.vn-input:focus { border-color: var(--vn-ink) !important; outline: none; box-shadow: 0 1px 0 0 var(--vn-ink); }\n.vn-input::placeholder { color: var(--text-muted); opacity: 0.7; }\n\n/* ── Links / nav ─────────────────────────────────────────────── */\n.vn-nav-link { position: relative; }\n.vn-nav-link::after {\n  content: \"\"; position: absolute; left: 0; right: 100%; bottom: -4px;\n  height: 1px; background: currentColor;\n  transition: right var(--dur-med) var(--ease-soft);\n}\n.vn-nav-link:hover::after { right: 0; }\n\n/* ── Cards (lift) ────────────────────────────────────────────── */\n.vn-card--interactive {\n  transition: transform var(--dur-med) var(--ease-soft), box-shadow var(--dur-med) var(--ease-soft);\n}\n.vn-card--interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }\n\n/* ── Image hover (slow zoom, editorial) ──────────────────────── */\n.vn-img-zoom { overflow: hidden; }\n.vn-img-zoom img { transition: transform var(--dur-slow) var(--ease-soft); }\n.vn-img-zoom:hover img { transform: scale(1.04); }\n<\u002Fstyle>\n<style>/* required styles */\r\n\r\n.leaflet-pane,\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow,\r\n.leaflet-tile-container,\r\n.leaflet-pane > svg,\r\n.leaflet-pane > canvas,\r\n.leaflet-zoom-box,\r\n.leaflet-image-layer,\r\n.leaflet-layer {\r\n\tposition: absolute;\r\n\tleft: 0;\r\n\ttop: 0;\r\n\t}\r\n.leaflet-container {\r\n\toverflow: hidden;\r\n\t}\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow {\r\n\t-webkit-user-select: none;\r\n\t   -moz-user-select: none;\r\n\t        user-select: none;\r\n\t  -webkit-user-drag: none;\r\n\t}\r\n/* Prevents IE11 from highlighting tiles in blue */\r\n.leaflet-tile::selection {\r\n\tbackground: transparent;\r\n}\r\n/* Safari renders non-retina tile on retina better with this, but Chrome is worse */\r\n.leaflet-safari .leaflet-tile {\r\n\timage-rendering: -webkit-optimize-contrast;\r\n\t}\r\n/* hack that prevents hw layers \"stretching\" when loading new tiles */\r\n.leaflet-safari .leaflet-tile-container {\r\n\twidth: 1600px;\r\n\theight: 1600px;\r\n\t-webkit-transform-origin: 0 0;\r\n\t}\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow {\r\n\tdisplay: block;\r\n\t}\r\n/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */\r\n/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */\r\n.leaflet-container .leaflet-overlay-pane svg {\r\n\tmax-width: none !important;\r\n\tmax-height: none !important;\r\n\t}\r\n.leaflet-container .leaflet-marker-pane img,\r\n.leaflet-container .leaflet-shadow-pane img,\r\n.leaflet-container .leaflet-tile-pane img,\r\n.leaflet-container img.leaflet-image-layer,\r\n.leaflet-container .leaflet-tile {\r\n\tmax-width: none !important;\r\n\tmax-height: none !important;\r\n\twidth: auto;\r\n\tpadding: 0;\r\n\t}\r\n\r\n.leaflet-container img.leaflet-tile {\r\n\t/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */\r\n\tmix-blend-mode: plus-lighter;\r\n}\r\n\r\n.leaflet-container.leaflet-touch-zoom {\r\n\t-ms-touch-action: pan-x pan-y;\r\n\ttouch-action: pan-x pan-y;\r\n\t}\r\n.leaflet-container.leaflet-touch-drag {\r\n\t-ms-touch-action: pinch-zoom;\r\n\t/* Fallback for FF which doesn't support pinch-zoom */\r\n\ttouch-action: none;\r\n\ttouch-action: pinch-zoom;\r\n}\r\n.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {\r\n\t-ms-touch-action: none;\r\n\ttouch-action: none;\r\n}\r\n.leaflet-container {\r\n\t-webkit-tap-highlight-color: transparent;\r\n}\r\n.leaflet-container a {\r\n\t-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);\r\n}\r\n.leaflet-tile {\r\n\tfilter: inherit;\r\n\tvisibility: hidden;\r\n\t}\r\n.leaflet-tile-loaded {\r\n\tvisibility: inherit;\r\n\t}\r\n.leaflet-zoom-box {\r\n\twidth: 0;\r\n\theight: 0;\r\n\t-moz-box-sizing: border-box;\r\n\t     box-sizing: border-box;\r\n\tz-index: 800;\r\n\t}\r\n/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */\r\n.leaflet-overlay-pane svg {\r\n\t-moz-user-select: none;\r\n\t}\r\n\r\n.leaflet-pane         { z-index: 400; }\r\n\r\n.leafle \n    .vn-lab--water { font-family: var(--font-body); font-style: italic; letter-spacing: 0.1em; font-size: 13px; color: #5b4a28; }\n    .vn-lab--big { font-size: 17px; letter-spacing: 0.22em; }\n\n    /* Cartouche */\n    .vn-cartouche { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 700; pointer-events: none;\n      background: linear-gradient(#f6efdd, #efe6cf); border: 1px solid #b9a985; box-shadow: 0 0 0 3px #efe6cf, 0 0 0 4px #c3b48f, 0 6px 18px -10px rgba(40,30,12,0.5);\n      padding: 0.5rem 1.3rem; text-align: center; max-width: 84%; }\n    .vn-cartouche .t { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: clamp(0.85rem, 1.5cqw, 1.15rem); color: #4a3a1c; line-height: 1; }\n    .vn-cartouche .s { font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.34em; font-size: 0.54rem; color: #7c6634; margin-top: 4px; }\n\n    /* Compass rose (functional map ornament) */\n    .vn-compass { position: absolute; left: 14px; top: 14px; z-index: 700; width: clamp(54px, 7cqw, 78px); height: auto; pointer-events: none; opacity: 0.9; filter: drop-shadow(0 2px 4px rgba(40,30,12,0.35)); }\n\n    /* Legend */\n    .vn-legend { position: absolute; top: 14px; right: 14px; z-index: 720; width: 210px; max-width: 62cqw;\n      background: linear-gradient(#f7f1e0, #efe6cf); border: 1px solid #b9a985; box-shadow: 0 0 0 4px rgba(233,223,199,0.6), 0 12px 30px -16px rgba(40,30,12,0.55); border-radius: 2px; padding: 0.7rem 0.75rem 0.8rem; }\n    .vn-legend-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; border-bottom: 1px solid #c9ba95; padding-bottom: 0.42rem; margin-bottom: 0.5rem; }\n    .vn-legend-hd .l { font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.58rem; color: #6b5730; }\n    .vn-legend-reset { font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.56rem; color: var(--vn-rust); background: none; border: none; cursor: pointer; padding: 0; }\n    .vn-legend-reset:hover { text-decoration: underline; }\n    .vn-legrow { display: flex; align-items: center; gap: 0.55rem; width: 100%; background: none; border: none; padding: 0.28rem 0.1rem; cursor: pointer; text-align: left; font-family: var(--font-body); font-size: 0.74rem; color: #3a3220; transition: opacity var(--dur-fast) var(--ease-soft); }\n    .vn-legrow .vn-sw { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; background: var(--sw); box-shadow: 0 0 0 1px rgba(0,0,0,0.18) inset; }\n    .vn-legrow .n { flex: 1; letter-spacing: 0.01em; }\n    .vn-legrow .c { font-variant-numeric: tabular-nums; opacity: 0.55; font-size: 0.68rem; }\n    .vn-legrow[data-on=\"false\"] { opacity: 0.4; }\n    .vn-legrow[data-on=\"false\"] .vn-sw { background: #a99f88; }\n    .vn-legrow:hover .n { color: #000; }\n    .vn-legend-routes { display: flex; align-items: center; gap: 0.55rem; width: 100%; background: none; border: none; border-top: 1px solid #c9ba95; margin-top: 0.4rem; padding: 0.5rem 0.1rem 0.1rem; cursor: pointer; font-family: var(--font-body); font-size: 0.72rem; color: #3a3220; }\n    .vn-legend-routes .vn-dash { width: 18px; border-top: 2px dashed #6b4a2e; flex: 0 0 auto; }\n    .vn-legend-routes[data-on=\"false\"] { opacity: 0.45; }\n\n    /* Pin — slim map teardrop with the brand key; tip marks the exact spot */\n    .vn-pin-wrap { background: none !important; border: none !important; }\n    .vn-pin { position: relative; width: var(--pin-w); cursor: pointer; transform-origin: 50% 100%; transition: transform var(--dur-med) var(--ease-soft); filter: drop-shadow(0 3px 2.5px rgba(28,18,6,0.45)); }\n    .vn-pin:hover { transform: translateY(-1px) scale(1.14); z-index: 5; }\n    .vn-pin-svg { display: block; width: 100%; height: auto; }\n    .vn-pin-body { fill: var(--pin-color); stroke: rgba(247,241,224,0.92); stroke-width: 1.5; }\n    .vn-pin-key { position: absolute; left: 50%; top: 35.5%; width: 66%; height: auto; transform: translate(-50%,-50%) rotate(-90deg); pointer-events: none; display: block; overflow: visible; }\n    .vn-pin-logo { position: absolute; left: 50%; top: 35%; width: 76%; height: auto; transform: translate(-50%,-50%); pointer-events: none; display: block; overflow: visible; }\n    .vn-pin-wrap:focus-visible { outline: none; }\n    .vn-pin-wrap:focus-visible .vn-pin-body { stroke: var(--vn-rust); stroke-width: 2.6; }\n    .vn-pin--home .vn-pin-body { stroke: rgba(177,192,223,0.98); stroke-width: 2; }\n    .vn-pin--signature .vn-pin-body { stroke: #f2e8d0; stroke-width: 1.7; }\n    .vn-pin--pending { opacity: 0.62; }\n    .vn-pin--pending .vn-pin-body { stroke-dasharray: 2.2 2; }\n\n    /* Pin detail card / bottom sheet */\n    .vn-detail { position: absolute; left: 14px; bottom: 14px; z-index: 900; width: min(330px, 46cqw);\n      background: linear-gradient(#f8f2e2, #efe6cf); border: 1px solid #b9a985;\n      box-shadow: 0 0 0 4px rgba(233,223,199,0.55), 0 20px 44px -18px rgba(30,20,8,0.6); border-radius: 2px; padding: 1.15rem 1.2rem 1.25rem;\n      animation: vnDetailIn 0.34s var(--ease-soft) both; }\n    @keyframes vnDetailIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }\n    .vn-detail-eye { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; font-size: 0.6rem; color: #7c6634; margin-bottom: 0.55rem; }\n    .vn-detail-eye .vn-sw { width: 9px; height: 9px; border-radius: 50%; background: var(--sw, #7c6634); box-shadow: 0 0 0 1px rgba(0,0,0,0.16) inset; }\n    .vn-detail h3 { font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; line-height: 1.02; font-size: clamp(1.3rem, 2.4cqw, 1.65rem); color: #2b2416; margin: 0 0 0.5rem; }\n    .vn-detail p { font-family: var(--font-body); font-size: 0.9rem; line-height: 1.6; color: #4a4130; margin: 0; }\n    .vn-detail .note { font-style: italic; font-size: 0.82rem; color: #6a5c40; margin-top: 0.55rem; }\n    .vn-detail .locked { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.9rem; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.6rem; color: var(--vn-rust); }\n    .vn-detail .soon { display: inline-block; margin-bottom: 0.5rem; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.58rem; color: #6a5c40; background: #e4d9bd; border: 1px solid #c3b48f; border-radius: 999px; padding: 0.2rem 0.6rem; }\n    .vn-detail .book { display: inline-flex; align-items: center; margin-top: 0.95rem; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.64rem; color: #fff; background: var(--vn-rust); border: 1px solid var(--vn-rust); border-radius: var(--radius-md); padding: 0.6rem 1rem; text-decoration: none; }\n    .vn-detail-x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; background: none; border: none; cursor: pointer; color: #7c6634; border-radius: 50%; }\n    .vn-detail-x:hover { background: rgba(120,96,58,0.12); color: #3a3220; }\n\n    /* Leaflet control restyle (antique) */\n    .vn-mapmat .leaflet-bar a { background: #f6efdd; color: #5a4a28; border-bottom-color: #c3b48f; }\n    .vn-mapmat .leaflet-bar a:hover { background: #efe4c9; color: #2b2416; }\n    .vn-mapmat .leaflet-control-scale-line { background: rgba(246,239,221,0.82); border-color: #8a744a; color: #5a4a28; font-family: var(--font-body); border-top: none; }\n    .vn-mapmat .leaflet-control-attribution { background: rgba(246,239,221,0.78); color: #6a5c40; font-family: var(--font-body); }\n    .vn-mapmat .leaflet-control-attribution a { color: #6b4a2e; }\n    .vn-route { filter: drop-shadow(0 1px 0 rgba(247,241,224,0.5)); }\n\n    /* Map fallback */\n    .vn-mapfail { position: absolute; inset: 0; z-index: 800; display: none; place-items: center; text-align: center; padding: 2rem; background: #e9dfc7; }\n    .vn-mapmat[data-failed=\"true\"] .vn-mapfail { display: grid; }\n\n    /* How-it-works numerals */\n    .vn-step-n { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--vn-rust); color: var(--vn-rust); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.25rem; }\n\n    .vn-catcard { transition: transform var(--dur-med) var(--ease-soft); }\n    .vn-catcard:hover { transform: translateY(-3px); }\n    .vn-catcard:hover .vn-catcard-t { color: var(--vn-rust); }\n    .vn-ph { position: relative; background: var(--vn-grey-300); overflow: hidden; }\n    .vn-ph::after { content: attr(data-label); position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.6rem; color: color-mix(in srgb, var(--vn-ink) 42%, transparent); }\n    .vn-linkline { position: relative; }\n    .vn-linkline::after { content: \"\"; position: absolute; left: 0; right: 100%; bottom: -3px; height: 1px; background: currentColor; transition: right var(--dur-med) var(--ease-soft); }\n    .vn-catcard:hover .vn-linkline::after, .vn-linkline:hover::after { right: 0; }\n\n    /* Responsive against the device frame */\n    @container (max-width: 900px) {\n      .vn-keys-hero-grid { grid-template-columns: 1fr !important; }\n      .vn-keys-hero-photo { order: -1; aspect-ratio: 16/10 !important; }\n      .vn-cards-grid { grid-template-columns: repeat(2, 1fr) !important; }\n      .vn-hiw-grid { grid-template-columns: 1fr !important; gap: 1.4rem !important; }\n    }\n    @container (max-width: 720px) {\n      .vn-legend { display: none !important; }\n      .vn-cards-grid { grid-template-columns: 1fr !important; }\n      .vn-cartouche .s { display: none; }\n      .vn-detail { left: 10px !important; right: 10px !important; bottom: 10px !important; width: auto !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"vn-device-stage\" data-device=\"{{ device }}\">\n<div class=\"vn-device-frame\" data-screen-label=\"Key to the City\" style=\"background: var(--vn-grey-200); color: var(--vn-ink); font-family: var(--font-body);\">\n\n  <div class=\"vn-stick\">\n    <dc-import name=\"SiteNav\" logo-size=\"Large\" hint-size=\"100%,72px\"><\u002Fdc-import>\n  <\u002Fdiv>\n\n  <!-- 1 · HERO -->\n  <section data-screen-label=\"Hero\" style=\"background: var(--vn-green); color: #fff; padding: clamp(3.5rem,7cqw,6rem) clamp(1.25rem,4cqw,3rem) clamp(3.5rem,7cqw,5.5rem);\">\n    <div class=\"vn-keys-hero-grid\" style=\"max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(2rem,5cqw,4.5rem); align-items: center;\">\n      <div>\n        <span style=\"display: block; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.26em; font-size: 0.72rem; color: var(--vn-blue); margin-bottom: 1.3rem;\">The signature experience<\u002Fspan>\n        <h1 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; line-height: 0.9; font-size: clamp(3rem,7.5cqw,6.2rem); margin: 0 0 1.3rem;\">Key to<br>the city<\u002Fh1>\n        <p style=\"font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.01em; font-size: clamp(1.05rem,1.9cqw,1.5rem); color: rgba(255,255,255,0.9); margin: 0 0 1.4rem;\">One key. A city of quiet privileges.<\u002Fp>\n        <p style=\"max-width: 480px; margin: 0; font-size: 1.0625rem; line-height: 1.75; color: rgba(255,255,255,0.86);\">Every guest is handed a small, hand-stitched leather key pocket. With it comes a collection of unexpected privileges across Trondheim — museums, saunas, shops, hikes and quiet corners — hand-picked so you discover the city through our eyes.<\u002Fp>\n        <div style=\"display: flex; gap: 1.1rem; align-items: center; flex-wrap: wrap; margin-top: 2rem;\">\n          <a href=\"#vn-keys-map\" class=\"vn-btn vn-btn--accent\" style=\"display: inline-flex; align-items: center; padding: 0.95rem 1.8rem; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.76rem; background: var(--vn-rust); color: #fff; border: 1px solid var(--vn-rust); border-radius: var(--radius-md); text-decoration: none;\">Open the map<\u002Fa>\n          <a href=\"book.dc.html\" class=\"vn-hero-link vn-linkline\" style=\"font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.74rem; color: #fff; text-decoration: none;\">Book your stay<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vn-keys-hero-photo\" style=\"aspect-ratio: 4/5; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);\">\n        <image-slot id=\"keys-hero-leather\" style=\"width:100%;height:100%;display:block;\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop a photo of the leather key pocket\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · THE MAP -->\n  <section id=\"vn-keys-map\" data-screen-label=\"The map\" style=\"padding: clamp(2.75rem,5cqw,4.5rem) clamp(1.25rem,4cqw,3rem) clamp(3rem,5cqw,4.5rem); scroll-margin-top: 84px;\">\n    <div style=\"max-width: 1240px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.4rem;\">\n        <div>\n          <span style=\"display: block; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.24em; font-size: 0.68rem; color: var(--vn-rust); margin-bottom: 0.8rem;\">Trondhjem, drawn by hand<\u002Fspan>\n          <h2 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; line-height: 1.0; font-size: clamp(1.9rem,3.6cqw,2.9rem); margin: 0;\">The city, unlocked<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"max-width: 380px; margin: 0; font-size: 0.95rem; line-height: 1.65; color: var(--text-muted);\">Filter by what you're after. Each seal marks a privilege — the details are revealed when you collect your key.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Filter chips -->\n      <div class=\"vn-chips\" role=\"group\" aria-label=\"Filter map by category\">\n        <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"7\">\n          <button type=\"button\" class=\"vn-chip vn-cat\" data-cat=\"{{ c.key }}\" data-on=\"{{ c.on }}\" aria-pressed=\"{{ c.on }}\" sc-camel-on-click=\"{{ c.toggle }}\"><span class=\"vn-sw\"><\u002Fspan>{{ c.label }}<span class=\"vn-ct\">{{ c.count }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n        <button type=\"button\" class=\"vn-chip vn-chip--routes\" data-on=\"{{ showRoutes }}\" aria-pressed=\"{{ showRoutes }}\" sc-camel-on-click=\"{{ toggleRoutes }}\"><span class=\"vn-dash\"><\u002Fspan>Routes<\u002Fbutton>\n        <button type=\"button\" class=\"vn-chip vn-chip--reset\" sc-camel-on-click=\"{{ resetView }}\">Reset view<\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- Antique map -->\n      <div class=\"vn-mapwrap\">\n        <div class=\"vn-mapmat\" data-tone=\"{{ tone }}\" data-failed=\"{{ mapFailed }}\">\n          <div class=\"vn-map\" ref=\"{{ setMapEl }}\"><\u002Fdiv>\n          <div class=\"vn-map-tint\"><\u002Fdiv>\n          <div class=\"vn-map-wash\"><\u002Fdiv>\n          <div class=\"vn-map-grain\"><\u002Fdiv>\n          <div class=\"vn-map-edge\"><\u002Fdiv>\n          <div class=\"vn-labels\" ref=\"{{ setLabelsEl }}\"><\u002Fdiv>\n\n          <svg class=\"vn-compass\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" aria-hidden=\"true\">\n            <circle cx=\"50\" cy=\"50\" r=\"34\" stroke=\"#7c6634\" stroke-width=\"1.4\" fill=\"rgba(246,239,221,0.35)\"><\u002Fcircle>\n            <circle cx=\"50\" cy=\"50\" r=\"27\" stroke=\"#9a8354\" stroke-width=\"0.6\"><\u002Fcircle>\n            <path d=\"M50 8 L56 50 L50 92 L44 50 Z\" fill=\"#8a744a\"><\u002Fpath>\n            <path d=\"M50 8 L56 50 L50 50 Z\" fill=\"#4a3a1c\"><\u002Fpath>\n            <path d=\"M8 50 L50 44 L92 50 L50 56 Z\" fill=\"#b6a279\"><\u002Fpath>\n            <path d=\"M8 50 L50 44 L50 50 Z\" fill=\"#6b5730\"><\u002Fpath>\n            <text x=\"50\" y=\"16\" text-anchor=\"middle\" font-family=\"Times New Roman,serif\" font-size=\"10\" fill=\"#4a3a1c\">N<\u002Ftext>\n          <\u002Fsvg>\n\n          <div class=\"vn-cartouche\">\n            <div class=\"t\">Key to the City<\u002Fdiv>\n            <div class=\"s\">Trondhjem · Villa Nord<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasCategories }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"vn-legend\">\n            <div class=\"vn-legend-hd\"><span class=\"l\">Legend<\u002Fspan><button type=\"button\" class=\"vn-legend-reset\" sc-camel-on-click=\"{{ resetView }}\">Reset<\u002Fbutton><\u002Fdiv>\n            <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"7\">\n              <button type=\"button\" class=\"vn-legrow vn-cat\" data-cat=\"{{ c.key }}\" data-on=\"{{ c.on }}\" sc-camel-on-click=\"{{ c.toggle }}\"><span class=\"vn-sw\"><\u002Fspan><span class=\"n\">{{ c.label }}<\u002Fspan><span class=\"c\">{{ c.count }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n            <button type=\"button\" class=\"vn-legend-routes\" data-on=\"{{ showRoutes }}\" sc-camel-on-click=\"{{ toggleRoutes }}\"><span class=\"vn-dash\"><\u002Fspan>Expedition routes<\u002Fbutton>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasActivePin }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"vn-detail vn-cat\" data-cat=\"{{ activePin.category }}\">\n            <button type=\"button\" class=\"vn-detail-x\" aria-label=\"Close\" sc-camel-on-click=\"{{ closePin }}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <div class=\"vn-detail-eye\"><span class=\"vn-sw\"><\u002Fspan>{{ activePin.label }}<\u002Fdiv>\n            <sc-if value=\"{{ activePin.pending }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"soon\">Coming soon<\u002Fspan><\u002Fsc-if>\n            <h3>{{ activePin.name }}<\u002Fh3>\n            <p>{{ activePin.teaser }}<\u002Fp>\n            <sc-if value=\"{{ activePin.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note\">{{ activePin.note }}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ activePin.isHome }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"book.dc.html\" class=\"book\">Book your stay<\u002Fa><\u002Fsc-if>\n            <sc-if value=\"{{ activePin.showLock }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"locked\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"1.5\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>Unlock with your key<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div class=\"vn-mapfail\">\n            <div>\n              <div style=\"font-family: var(--font-display); text-transform: uppercase; font-size: 1.3rem; color: #4a3a1c; margin-bottom: 0.5rem;\">The map is resting<\u002Fdiv>\n              <p style=\"font-family: var(--font-body); font-size: 0.9rem; color: #6a5c40; max-width: 280px; margin: 0 auto;\">The living map couldn't load just now. Every privilege still waits behind your key at the reception.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 0.9rem 0 0; font-family: var(--font-body); font-size: 0.74rem; color: var(--text-muted); letter-spacing: 0.02em;\">Placement is approximate — a prototype sketch over real Trondheim streets, dressed after B. A. Blom's 1830 map of the city.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · CATEGORY CARDS -->\n  <section data-screen-label=\"Categories\" style=\"background: var(--vn-grey-100, #f6f5f2); padding: clamp(3rem,6cqw,5rem) clamp(1.25rem,4cqw,3rem);\">\n    <div style=\"max-width: 1200px; margin: 0 auto;\">\n      <span style=\"display: block; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.24em; font-size: 0.68rem; color: var(--vn-rust); margin-bottom: 0.9rem;\">What a key opens<\u002Fspan>\n      <h2 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; line-height: 1.0; font-size: clamp(1.9rem,3.6cqw,2.9rem); margin: 0 0 2.4rem; max-width: 16ch;\">Seven ways to belong here<\u002Fh2>\n      <div class=\"vn-cards-grid\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1.4rem,2.6cqw,2.2rem);\">\n        <sc-for list=\"{{ cards }}\" as=\"k\" hint-placeholder-count=\"7\">\n          <div class=\"vn-catcard\" style=\"display: flex; flex-direction: column;\">\n            <div class=\"vn-ph\" data-label=\"Photograph\" style=\"aspect-ratio: 3/2; border-radius: var(--radius-md); margin-bottom: 1.1rem;\"><\u002Fdiv>\n            <div class=\"vn-cat\" data-cat=\"{{ k.key }}\" style=\"display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.62rem; color: var(--text-muted); margin-bottom: 0.6rem;\"><span style=\"width:9px;height:9px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1px rgba(0,0,0,0.14) inset;\"><\u002Fspan>{{ k.label }}<\u002Fdiv>\n            <h3 class=\"vn-catcard-t\" style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; line-height: 1.04; font-size: 1.35rem; margin: 0 0 0.6rem; transition: color 200ms var(--ease-soft);\">{{ k.title }}<\u002Fh3>\n            <p style=\"font-size: 0.95rem; line-height: 1.6; color: var(--text-muted); margin: 0 0 1.1rem; flex: 1;\">{{ k.line }}<\u002Fp>\n            <button type=\"button\" class=\"vn-linkline\" sc-camel-on-click=\"{{ k.see }}\" style=\"align-self: flex-start; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.7rem; color: var(--vn-ink);\">See on the map<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · HOW IT WORKS -->\n  <section data-screen-label=\"How it works\" style=\"background: var(--vn-blue); color: var(--vn-ink); padding: clamp(3rem,6cqw,5rem) clamp(1.25rem,4cqw,3rem);\">\n    <div style=\"max-width: 1100px; margin: 0 auto;\">\n      <span style=\"display: block; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.24em; font-size: 0.68rem; color: var(--vn-green); margin-bottom: 0.9rem;\">Simple as a turning key<\u002Fspan>\n      <h2 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; line-height: 1.0; font-size: clamp(1.9rem,3.6cqw,2.9rem); margin: 0 0 2.6rem;\">How it works<\u002Fh2>\n      <div class=\"vn-hiw-grid\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1.6rem,3cqw,3rem);\">\n        <div>\n          <div class=\"vn-step-n\" style=\"margin-bottom: 1.1rem;\">01<\u002Fdiv>\n          <h3 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; font-size: 1.4rem; margin: 0 0 0.6rem;\">Check in<\u002Fh3>\n          <p style=\"font-size: 1rem; line-height: 1.65; color: var(--vn-ink); opacity: 0.82; margin: 0;\">Arrive at Dronningens gate 26. There is no front desk — only a welcome, and someone expecting you.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"vn-step-n\" style=\"margin-bottom: 1.1rem;\">02<\u002Fdiv>\n          <h3 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; font-size: 1.4rem; margin: 0 0 0.6rem;\">Collect your key<\u002Fh3>\n          <p style=\"font-size: 1rem; line-height: 1.65; color: var(--vn-ink); opacity: 0.82; margin: 0;\">Your leather key pocket is handed over at the reception — and with it, the privileges held quietly inside.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div class=\"vn-step-n\" style=\"margin-bottom: 1.1rem;\">03<\u002Fdiv>\n          <h3 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; font-size: 1.4rem; margin: 0 0 0.6rem;\">Unlock the city<\u002Fh3>\n          <p style=\"font-size: 1rem; line-height: 1.65; color: var(--vn-ink); opacity: 0.82; margin: 0;\">Show your key and step through. Trondheim opens — a door at a time, at your own slow pace.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · CTA -->\n  <section data-screen-label=\"CTA\" style=\"background: var(--vn-green); color: #fff; padding: clamp(3.5rem,7cqw,6rem) clamp(1.25rem,4cqw,3rem); text-align: center;\">\n    <div style=\"max-width: 760px; margin: 0 auto;\">\n      <img src=\"c27f3edd-9e00-4c97-a35c-180c794286be\" alt=\"\" style=\"width: 34px; height: auto; opacity: 0.8; margin-bottom: 1.6rem;\">\n      <h2 style=\"font-family: var(--font-display); text-transform: uppercase; font-weight: 400; letter-spacing: -0.01em; line-height: 1.02; font-size: clamp(2rem,4.6cqw,3.4rem); margin: 0 0 1.3rem;\">Your key is waiting at<br>Dronningens gate 26<\u002Fh2>\n      <p style=\"max-width: 480px; margin: 0 auto 2.2rem; font-size: 1.0625rem; line-height: 1.75; color: rgba(255,255,255,0.86);\">Reserve your stay and we'll have it ready — hand-stitched, and heavy with a city's worth of quiet privileges.<\u002Fp>\n      <div style=\"display: flex; gap: 1.1rem; align-items: center; justify-content: center; flex-wrap: wrap;\">\n        <a href=\"book.dc.html\" class=\"vn-btn vn-btn--accent\" style=\"display: inline-flex; align-items: center; padding: 0.95rem 1.9rem; font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.76rem; background: var(--vn-rust); color: #fff; border: 1px solid var(--vn-rust); border-radius: var(--radius-md); text-decoration: none;\">Book your stay<\u002Fa>\n        <a href=\"experiences.dc.html\" class=\"vn-hero-link vn-linkline\" style=\"font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.74rem; color: #fff; text-decoration: none;\">See all experiences<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <x-import component-from-global-scope=\"VillaNordDesignSystem_bf825c.Footer\" logo-base=\"assets/logos\" address=\"{{ footerAddress }}\" email=\"info@villanord.no\" columns=\"{{ footerColumns }}\" note=\"Key to the City is included with every stay. Strava challenges run separately.\" hint-size=\"100%,320px\"><\u002Fx-import>\n\n<\u002Fdiv><\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2400},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Desktop&quot;,&quot;Tablet&quot;,&quot;Mobile&quot;],&quot;default&quot;:&quot;Desktop&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;mapTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Parchment&quot;,&quot;Sepia&quot;,&quot;Faded&
